name: Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Core regressions
        run: python tests/run_all.py
      - name: Desktop regressions
        shell: pwsh
        run: |
          foreach ($test in @('gui_smoke', 'gui_modes_smoke', 'gui_llm_smoke', 'gui_play_status_smoke', 'benchmark_gui_smoke')) {
            python "tests/$test.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build executable
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --clean --noconfirm gui.spec
      - name: Verify packaged window and checksum
        shell: pwsh
        run: |
          $app = Start-Process dist/gui.exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "gui.exe exited before opening a window" }
              # One-file PyInstaller opens the window in a child process.
              $childIds = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($app.Id)" | Select-Object -ExpandProperty ProcessId)
              $window = @(Get-Process -Id (@($app.Id) + $childIds) -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like '掼蛋*' })
            } while ($window.Count -eq 0 -and (Get-Date) -lt $deadline)
            if ($window.Count -eq 0) { throw "No game window appeared" }
            Write-Host "Packaged GUI opened: $($window[0].MainWindowTitle)"
          } finally {
            if (-not $app.HasExited) { taskkill /PID $app.Id /T /F }
          }
          $hash = (Get-FileHash dist/gui.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  gui.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows-x64
          path: |
            dist/gui.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME dist/gui.exe dist/SHA256SUMS.txt --verify-tag --title "Guandan AI $env:GITHUB_REF_NAME" --generate-notes
